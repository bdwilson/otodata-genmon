[genotodata]
# Display name for the tank shown in the genmon web interface.
tank_name = Propane Tank

# Tank capacity in gallons. Set to 0 to omit from genmon data.
capacity = 0

# Minutes between BLE scan cycles. The Otodata sensor updates ~every few minutes,
# so 5 minutes is a reasonable default.
poll_frequency = 5

# Seconds to listen for BLE advertisements during each scan cycle.
# Increase this if the sensor is far away or the Pi's Bluetooth is weak.
scan_time = 30

# Optional: restrict readings to a specific sensor by Bluetooth MAC address.
# Leave blank to accept any device that broadcasts an Otodata-style level string.
# Example: aa:bb:cc:dd:ee:ff
mac_address =

# --- Hubitat integration (optional) ---
# See https://github.com/bdwilson/hubitat/tree/master/Otodata-Propane for the
# required Hubitat app and driver.
do_hubitat = False
hubitat_url = http://192.168.1.xx/apps/api/xxx/update/
hubitat_key =
