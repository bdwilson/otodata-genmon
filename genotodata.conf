[genotodata]
# Display name for the tank shown in the genmon web interface.
tank_name = Propane Tank

# Tank capacity in gallons. Set to 0 to omit from genmon data.
capacity = 0

# Minutes between BLE scan cycles.
poll_frequency = 5

# Seconds to listen for BLE advertisements during each scan cycle.
# Increase if the sensor is far from the Pi or BLE is unreliable.
scan_time = 30

# Optional: restrict readings to a specific sensor by Bluetooth MAC address.
# Leave blank to accept any device that broadcasts an Otodata-style level string.
# Example: aa:bb:cc:dd:ee:ff
mac_address =
